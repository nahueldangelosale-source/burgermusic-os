name: CI — BurgerMusic OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate (Types → Lint → Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (Biome)
        run: npm run lint

      - name: Run Tests (Vitest)
        run: npm test
        env:
          # Minimal env vars for test context (no real credentials)
          AUTH_SECRET: ci-test-secret-not-real
          KITCHEN_PIN: "0000"
          TURSO_DATABASE_URL: "file:ci-test.db"
