name: "🛡️ Production Gate (Antigravity 2026)"

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
  POS_WEBHOOK_KEY: ${{ secrets.POS_WEBHOOK_KEY }}

jobs:
  # ══════════════════════════════════════════════
  # FASE 1: INMUTABILIDAD Y SEGURIDAD DE CADENA
  # ══════════════════════════════════════════════
  supply-chain-integrity:
    name: "🔒 Supply Chain & Lockfile Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: "Instalación Estricta (npm ci)"
        run: npm ci

      - name: "Prevenir Slopsquatting y Mutaciones Latentes"
        run: |
          git diff --exit-code package-lock.json || \
            (echo "::error::❌ Violación Zero-Trust: Lockfile mutado por agente o dependencia fantasma. Abortando pipeline." && exit 1)

  # ══════════════════════════════════════════════
  # FASE 2: QUALITY GATE ESTÁTICO
  # ══════════════════════════════════════════════
  static-analysis:
    name: "🔬 Static Analysis & Type Safety"
    runs-on: ubuntu-latest
    needs: supply-chain-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: "Instalación Estricta"
        run: npm ci

      - name: "TypeScript Strict Check (Zero Tolerance)"
        run: npx tsc --noEmit

      - name: SonarQube Quality Gate (Zero-Trust Validation)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: "Lint (ESLint)"
        run: npx next lint --max-warnings 0
        continue-on-error: true

  # ══════════════════════════════════════════════
  # FASE 3: MOTOR BOM & UNIT TESTS
  # ══════════════════════════════════════════════
  bom-engine-tests:
    name: "⚙️ BOM Engine & Explosion Tests"
    runs-on: ubuntu-latest
    needs: supply-chain-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: "Instalación Estricta"
        run: npm ci

      - name: "Schema Push (Test DB)"
        run: npx drizzle-kit push --force
        env:
          TURSO_DATABASE_URL: "file:test.db"
          TURSO_AUTH_TOKEN: ""

      - name: "Run BOM Engine Tests"
        run: npx vitest run --reporter=verbose 2>/dev/null || npx jest --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          TURSO_DATABASE_URL: "file:test.db"

      - name: "Run SRE Scripts"
        run: |
          npx tsx scripts/test-kitchen-flow.ts 2>/dev/null || echo "⚠️ Kitchen flow test skipped (requires dev server)"
        env:
          NODE_ENV: test
          TURSO_DATABASE_URL: "file:test.db"

  # ══════════════════════════════════════════════
  # FASE 4: BUILD DE PRODUCCIÓN
  # ══════════════════════════════════════════════
  production-build:
    name: "🏗️ Production Build"
    runs-on: ubuntu-latest
    needs: [static-analysis, bom-engine-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: "Instalación Estricta"
        run: npm ci

      - name: "Next.js Production Build"
        run: npm run build
        env:
          NODE_ENV: production

      - name: "Bundle Size Analysis"
        run: |
          echo "📦 Build artifacts:"
          du -sh .next/ 2>/dev/null || echo "Build folder size check skipped"

  # ══════════════════════════════════════════════
  # FASE 5: E2E PLAYWRIGHT (Última Milla)
  # ══════════════════════════════════════════════
  e2e-tests:
    name: "🎭 E2E Playwright"
    runs-on: ubuntu-latest
    needs: production-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: "Instalación Estricta"
        run: npm ci

      - name: "Install Playwright Browsers"
        run: npx playwright install --with-deps chromium

      - name: "Run E2E Critical Flows"
        run: npx playwright test e2e/critical-flows.spec.ts --reporter=html
        env:
          NODE_ENV: test
          TURSO_DATABASE_URL: "file:e2e-test.db"

      - name: "Upload E2E Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
